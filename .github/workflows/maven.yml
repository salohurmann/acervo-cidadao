name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: acervo-cidadao-war
          path: target/*.war
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t acervo-cidadao:ci .

      - name: Smoke test (página inicial, login, cadastro de livro)
        run: sh ci/smoke-test.sh acervo-cidadao:ci
